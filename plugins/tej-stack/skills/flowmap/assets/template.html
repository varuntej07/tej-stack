<style>

:root[data-theme="dark"]{

.insp .body{overflow:auto;padding:16px 16px 40px;flex:1;min-width:0}
.ihead .k{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--kc);background:color-mix(in srgb,var(--kc) 13%,transparent);padding:5px 7px;border-radius:5px}

.sec{margin-top:20px}

.sec p{margin:0;color:var(--fg);font-size:13.5px;line-height:1.6}
.loc-row{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 8px 7px 10px;min-width:0}
.loc-row code{font:12px var(--mono);flex:1;min-width:0;overflow-x:auto;white-space:nowrap}
.copy{font:500 11px var(--sans);color:var(--muted);border:1px solid var(--line-2);border-radius:5px;padding:3px 7px;flex:none}
.copy:hover{color:var(--fg)}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 0;overflow-x:auto;font:12px/1.6 var(--mono);color:var(--fg)}
pre .ln{display:block;padding:0 12px;white-space:pre}
pre .ln[data-n]::before{content:attr(data-n);display:inline-block;width:3.2ch;margin-right:12px;text-align:right;color:var(--faint)}
pre.plain{padding:10px 12px;white-space:pre-wrap;word-break:break-word}

.kv>div{padding:6px 10px;font-size:12.5px;border-top:1px solid var(--line);min-width:0}
.kv>div:nth-child(-n+2){border-top:0}
.kv .kk{color:var(--muted);background:var(--panel-2);font:12px var(--mono)}
.kv .vv{font:12px/1.5 var(--mono);word-break:break-word}
.io{display:flex;flex-direction:column;gap:6px}
.io .row{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.io .row .nm{font:500 12.5px var(--mono)}
.io .row .ty{font:12px var(--mono);color:var(--h-violet);margin-left:6px}
.io .row .ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--mono);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;color:var(--fg);background:var(--panel)}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
ul.notes{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
ul.notes li+li{margin-top:4px}
ul.notes.warn li::marker{color:var(--h-rose)}
.links{display:flex;flex-direction:column;gap:6px}

.links a span{display:block;font:11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{display:flex;flex-direction:column;gap:5px}

.conn .dir{font:11px var(--mono);color:var(--faint);flex:none;width:28px}
.conn .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn .el{font:11px var(--mono);color:var(--muted);flex:none;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--panel-2);border-radius:8px;padding:8px 10px}

.stats span{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--kc)}
.conf{font:500 11px var(--mono);padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.conf.verified{background:color-mix(in srgb,var(--h-green) 15%,transparent);color:var(--h-green)}
.conf.inferred{background:color-mix(in srgb,var(--h-amber) 16%,transparent);color:var(--h-amber)}
.primary{display:inline-flex;align-items:center;gap:6px;background:var(--fg);color:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;font-size:13px}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}

.empty h2{font-size:17px;margin:0 0 6px}.empty p{color:var(--muted);margin:0 0 14px;font-size:13px}
.hint{position:absolute;left:12px;bottom:12px;font:11px var(--mono);color:var(--faint);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;pointer-events:none}
.only-narrow{display:none}
@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"top top" "canvas insp"}.layers{display:none}.layers.open{display:flex;position:absolute;z-index:6;top:47px;left:0;bottom:0;width:260px;box-shadow:var(--shadow)}.only-narrow{display:inline-flex}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

  add(b,listSec("Notes",m.notes));add(b,listSec("Gotchas",m.gotchas,"warn"));
  add(b,linksSec("Sources and docs",m.sources));
  var ins=inE[n.id],outs=outE[n.id];if(ins.length||outs.length){var s8=sec("Connections"),w=el("div","conn");
    ins.forEach(function(e){w.appendChild(connBtn("from",e.from,e))});outs.forEach(function(e){w.appendChild(connBtn("to",e.to,e))});s8.appendChild(w);b.appendChild(s8)}
}
function connBtn(dir,id,e){var bt=el("button");bt.appendChild(el("span","dir",dir==="from"?"in":"out"));bt.appendChild(el("span","t",byId[id].title||id));if(e.label)bt.appendChild(el("span","el",e.label));bt.onclick=function(){select(id,true)};return bt}

function overview(){
  var b=ibody;b.textContent="";$("inspLbl").textContent="Overview";
  var h=el("div","ihead");h.style.setProperty("--kc","var(--h-slate)");h.appendChild(el("span","k",(G.mode||"code")+" map"));h.appendChild(el("h2",null,G.title||"Flowmap"));if(G.subject)h.appendChild(el("div","sub",G.subject));b.appendChild(h);
  if(G.summary){var s=sec("Summary");String(G.summary).split(/\n{2,}/).forEach(function(par,i){var p=el("p",null,par);if(i)p.style.marginTop="8px";s.appendChild(p)});b.appendChild(s)}
  var st=sec("Size"),g=el("div","stats");[[G.nodes.length,"blocks"],[G.edges.length,"links"],[Math.max(G.groups.length,1),"groups"]].forEach(function(x){var d=el("div");d.appendChild(el("b",null,x[0]));d.appendChild(el("span",null,x[1]));g.appendChild(d)});st.appendChild(g);b.appendChild(st);
  var kinds={};G.nodes.forEach(function(n){kinds[n.kind||"step"]=1});var lg=sec("Legend"),l=el("div","legend");
  Object.keys(kinds).forEach(function(k){var s=el("span");s.style.setProperty("--kc",hue(k));s.appendChild(el("i"));s.appendChild(document.createTextNode(kindOf(k)[1]));l.appendChild(s)});lg.appendChild(l);b.appendChild(lg);
  var root=G.root&&byId[G.root]?G.root:steps[0];if(root){var sr=sec("Start here"),bt=el("button","primary","Open "+(byId[root].title||root));bt.onclick=function(){stepIx=-1;select(root,true)};sr.appendChild(bt);b.appendChild(sr)}
  add(b,kvSec("Context",G.context));
  add(b,listSec("Assumptions and limits",G.limits));
  add(b,linksSec("Sources and docs",G.sources));
  if(G.generated_at||G.generator){var gm=sec("Generated");gm.appendChild(el("p",null,[G.generator,G.generated_at].filter(Boolean).join(" · ")));b.appendChild(gm)}
}

load();
})();
