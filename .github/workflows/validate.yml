name: Validate

on:
  push:
  pull_request:

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate.py
      - name: Smoke test Unix installer
        if: runner.os != 'Windows'
        run: ./scripts/install.sh both --user --home "$RUNNER_TEMP/tej-stack-home"
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install.ps1 both -Scope user -HomeDirectory "$env:RUNNER_TEMP\tej-stack-home"
